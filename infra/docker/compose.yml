name: doculens
x-backend: &backend
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://doculens:doculens-local@postgres:5432/doculens
    DEMO_MODE: "true"
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    S3_BUCKET: doculens
    AWS_ACCESS_KEY_ID: doculens-local
    AWS_SECRET_ACCESS_KEY: doculens-local-secret
    AWS_DEFAULT_REGION: us-east-1
    CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  depends_on:
    postgres: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}
  restart: unless-stopped
  mem_limit: 2g
  cpus: 2
services:
  postgres:
    image: postgres:16.9-alpine
    environment: {POSTGRES_DB: doculens, POSTGRES_USER: doculens, POSTGRES_PASSWORD: doculens-local}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U doculens"], interval: 3s, timeout: 3s, retries: 20}
  minio:
    build: {context: ../.., dockerfile: infra/docker/minio.Dockerfile}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: doculens-local
      MINIO_ROOT_PASSWORD: doculens-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [objects:/data]
  minio-init:
    build: {context: ../.., dockerfile: infra/docker/Dockerfile}
    depends_on: [minio]
    environment: *environment
    command: [python, -m, scripts.init_storage]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"], interval: 10s, timeout: 5s, retries: 20}
  worker:
    <<: *backend
    command: [python, -m, workers.processor.main]
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 120s
  web:
    build: {context: ../.., dockerfile: infra/docker/web.Dockerfile}
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  objects:
