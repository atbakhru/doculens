apiVersion: v1
kind: Namespace
metadata: {name: doculens}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: doculens-config, namespace: doculens}
data:
  DEMO_MODE: "false"
  STORAGE_BACKEND: s3
  AWS_DEFAULT_REGION: us-east-1
  S3_BUCKET: REPLACE_PRIVATE_BUCKET
  CORS_ORIGINS: https://REPLACE_FRONTEND_ORIGIN
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: doculens, namespace: doculens}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: doculens-api, namespace: doculens}
spec:
  replicas: 2
  selector: {matchLabels: {app: doculens-api}}
  template:
    metadata: {labels: {app: doculens-api}}
    spec:
      serviceAccountName: doculens
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: REPLACE_REGISTRY/doculens:REPLACE_COMMIT_SHA
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: doculens-config}
            - secretRef: {name: doculens-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 30}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: doculens-api, namespace: doculens}
spec:
  selector: {app: doculens-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: doculens-processor, namespace: doculens}
spec:
  replicas: 3
  selector: {matchLabels: {app: doculens-processor}}
  template:
    metadata: {labels: {app: doculens-processor}}
    spec:
      serviceAccountName: doculens
      terminationGracePeriodSeconds: 120
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: processor
          image: REPLACE_REGISTRY/doculens:REPLACE_COMMIT_SHA
          command: [python, -m, workers.processor.main]
          envFrom:
            - configMapRef: {name: doculens-config}
            - secretRef: {name: doculens-secrets}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            exec: {command: [python, -c, "from pathlib import Path; assert Path('.data/worker-heartbeat').exists()"]}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec: {command: [python, -c, "import time; from pathlib import Path; assert time.time()-Path('.data/worker-heartbeat').stat().st_mtime < 240"]}
            periodSeconds: 30
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: doculens-processor-hpa, namespace: doculens}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: doculens-processor}
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: doculens-worker-budget, namespace: doculens}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: doculens-processor}}
