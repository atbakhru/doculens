apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doculens-api
  namespace: doculens
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [REPLACE_API_HOST]
      secretName: doculens-tls
  rules:
    - host: REPLACE_API_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: doculens-api, port: {number: 80}}}
