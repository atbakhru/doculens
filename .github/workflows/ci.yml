name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.evaluate --output /tmp/evaluation.json
        env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1'}
      - uses: actions/upload-artifact@v4
        with: {name: evaluation, path: /tmp/evaluation.json}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-report, path: apps/web/playwright-report}
  native-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f native/vision/Dockerfile -t doculens-native .
      - run: docker run --rm doculens-native
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx==0.28.1
      - run: docker compose -f infra/docker/compose.yml up -d --build --wait
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose -f infra/docker/compose.yml logs --tail=100
      - if: always()
        run: docker compose -f infra/docker/compose.yml down
