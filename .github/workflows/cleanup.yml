name: Retire superseded checks
on:
  push:
    paths: ['.github/workflows/cleanup.yml']
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: write
jobs:
  retire:
    if: github.event_name == 'push' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run?.head_branch || context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              branch,
              event: 'push',
              per_page: 100
            });
            const finished = data.workflow_runs.find(run => run.conclusion === 'success');
            if (!finished) return;
            for (const run of data.workflow_runs) {
              if (run.run_number < finished.run_number && run.status !== 'completed') {
                core.info(`Retiring superseded run ${run.id}`);
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                } catch (error) {
                  // A concurrently completed run no longer needs cancellation.
                  if (error.status !== 409) throw error;
                }
              }
            }
